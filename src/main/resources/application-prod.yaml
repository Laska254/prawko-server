cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  sql:
    init:
      mode: never

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true

mail:
  from: ${MAIL_FROM}

password-reset:
  url: ${PASSWORD_RESET_URL}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
