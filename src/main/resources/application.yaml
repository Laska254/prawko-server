server:
  port: 8080
  tomcat:
    # a rejected upload is read up to this size, so the client gets the 413 instead of losing the connection;
    # over it the connection is still lost, the cap limits how long a rejected request can hold a thread.
    # Keep it above spring.servlet.multipart.max-request-size (twice that here).
    max-swallow-size: 20MB

spring:
  application:
    name: "Prawko server"

  profiles:
    default: dev

  data:
    web:
      pageable:
        max-page-size: 100

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  jpa:
    open-in-view: false

  task:
    execution:
      pool:
        core-size: 8
        max-size: 8
        queue-capacity: 100
      shutdown:
        await-termination: true
        await-termination-period: 30s

  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

  http:
    clients:
      connect-timeout: 5s
      read-timeout: 10s

  web:
    error:
      whitelabel:
        enabled: false

exam:
  expiry-check-interval: 30s

media:
  directory: media
  cache-max-age: 1d

access-token:
  validity: 15m

refresh-token:
  validity: 30d
  reuse-grace: 30s
  cleanup-interval: 1h

password-reset:
  token-validity: 15m
  cooldown: 1m

email-verification:
  token-validity: 24h
  cooldown: 1m
  cleanup-interval: 1h

google:
  client-ids: ""
  jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

github:
  client-id: ""
  client-secret: ""
